<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildberries DARK — Мужской стиль</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- NAV BAR (Одинаковый для всех страниц) -->
    <header class="wb-header">
        <div class="wb-container header-flex">
            <a href="index.html" class="wb-logo">DIRAKT</a>
            <div class="wb-search-bar">
                <input type="text" placeholder="Искать брутальный дроп...">
                <span class="search-icon">🔍</span>
            </div>
            <nav class="wb-user-menu">
                <a href="catalog.html">Каталог</a>
                <span>Войти</span>
                <span class="cart-link">Корзина <span class="cart-count">0</span></span>
            </nav>
        </div>
    </header>

    <!-- HERO PROMO -->
    <section class="hero-banner">
        <div class="wb-container">
            <div class="promo-badge">NEW DROP 2026</div>
            <h1 class="hero-text">ALPHA TEMPLAR:<br><span class="text-red">ЧЕРНЫЙ НЕОН</span></h1>
            <p class="hero-sub">Эксклюзивная коллекция мужской одежды на стыке текно и streetwear.</p>
            <a href="catalog.html" class="btn-main">ОТКРЫТЬ КАТАЛОГ</a>
        </div>
    </section>

    <!-- CATEGORIES -->
    <section class="wb-container section-pad">
        <h2 class="page-title">ПОПУЛЯРНЫЕ КАТЕГОРИИ</h2>
        <div class="categories-grid">
            <a href="catalog.html" class="cat-card">
                <div class="cat-img-stub">ХУДИ / СВИТШОТЫ</div>
                <h3>Толстовки <span class="text-red">→</span></h3>
            </a>
            <a href="catalog.html" class="cat-card">
                <div class="cat-img-stub">ШТАНЫ / КАРГО</div>
                <h3>Брюки и джоггеры <span class="text-red">→</span></h3>
            </a>
            <a href="catalog.html" class="cat-card">
                <div class="cat-img-stub">АКСЕССУАРЫ</div>
                <h3>Рюкзаки и кепки <span class="text-red">→</span></h3>
            </a>
        </div>
    </section>

</body>
</html>

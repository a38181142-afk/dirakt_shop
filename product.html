<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить Худи ALPHA WEAR на WB</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- NAV BAR -->
    <header class="wb-header">
        <div class="wb-container header-flex">
            <a href="index.html" class="wb-logo">WILDBERRIES <span class="badge-dark">DARK</span></a>
            <div class="wb-search-bar">
                <input type="text" placeholder="Я ищу...">
                <span class="search-icon">🔍</span>
            </div>
            <nav class="wb-user-menu">
                <a href="catalog.html">Каталог</a>
                <span>Войти</span>
                <span class="cart-link">Корзина <span class="cart-count">1</span></span>
            </nav>
        </div>
    </header>

    <!-- PRODUCT SECTION -->
    <main class="wb-container main-grid section-pad">
        <section class="product-gallery">
            <div class="thumbs-column">
                <div class="thumb active">ФОТО 1</div>
                <div class="thumb">ФОТО 2</div>
                <div class="thumb">ФОТО 3</div>
            </div>
            <div class="main-image-preview">
                <div class="badge-sale">🔥 ТОП</div>
                <div class="image-text">ALPHA HOODIE</div>
            </div>
        </section>

        <section class="product-info-panel">
            <div class="brand-line">
                <span class="brand-name">ALPHA WEAR</span>
                <span class="rating">★ 5.0 <span class="reviews-qty">(432 отзыва)</span></span>
            </div>
            <h1 class="product-title">Худи мужское оверсайз черное с капюшоном</h1>
            <p class="art-number">Арт: <span class="text-light">234567890</span></p>

            <div class="price-block">
                <div class="current-price">4 200 ₽</div>
                <div class="old-price">12 500 ₽</div>
                <div class="discount-badge">-66%</div>
            </div>

            <div class="size-selector">
                <div class="size-title-row">
                    <span>Выберите размер:</span>
                </div>
                <div class="size-chips">
                    <button class="size-chip">48</button>
                    <button class="size-chip active">50</button>
                    <button class="size-chip">52</button>
                </div>
            </div>

            <div class="action-block">
                <button class="btn-add-to-cart">Добавить в корзину</button>
                <button class="btn-favorite">🖤</button>
            </div>
        </section>
    </main>

</body>
</html>
